workdir: ${PACKMAN_NOVA_WORKDIR}
project_name: packman-nova
packager: "Oleg Antonyan <oleg.b.antonyan@gmail.com>"
offline: false
distros: [opensuse_tumbleweed, opensuse_leap_16.0, opensuse_leap_16.1]
sources:
  obs_api: https://api.opensuse.org/public
  http: { timeout_sec: 600, retries: 5 }
container:
  runtime: auto
  image: localhost/packman-nova-builder:latest
  containerfile: container/Containerfile
  privileged: true
  extra_args: []
pbuild:
  buildjobs: 2
  jobs: 8
  checks: true
  debuginfo: false
  repo_refresh: true
  timeout_sec: 43200
  extra_args: []
signing:
  gpg_private_key_base64: ${GPG_PRIVATE_KEY_BASE64}
  require_signature: true
repository:
  slug: packman-nova-essentials
  public_url: ${PACKMAN_NOVA_PUBLIC_URL}
  publish_srpms: true
  publish_debuginfo: false
  provider: localfs
  installcheck:
    enabled: true
  localfs:
    path: ${PACKMAN_NOVA_REPO_PATH}
  s3:
    bucket: ${CLOUDFLARE_R2_BUCKET}
    path_in_bucket: ""
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    access_key_id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret_access_key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    region: auto
    force_path_style: true
    cloudflare_zone_id: ${CLOUDFLARE_ZONE_ID}
    cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
site:
  name: packman-nova
  title: 'packman-nova: Packman codecs for openSUSE Tumbleweed and Leap 16'
  description: 'Full multimedia codecs for openSUSE: ffmpeg, x264, x265, fdk-aac, and codecs for GStreamer and VLC. Built from the Packman Essentials sources and signed every night.'
  source_url: https://github.com/olegantonyan/packman-nova
