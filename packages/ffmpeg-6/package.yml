notes: "Frozen copy of Factory's dropped ffmpeg-6 (PMBS A_tw-ffmpeg-6). Tarball is tar_scm (mode disabled) of git.ffmpeg.org rev 01d3f764 with excludes, so ffmpeg.org's release tarball differs. Spec carries a local svtav1 bcond (off): Factory SVT-AV1 is 4.x, this ffmpeg needs < 4, and a private SVT-AV1 3.0.1 would shadow Factory's for every ffmpeg build."
