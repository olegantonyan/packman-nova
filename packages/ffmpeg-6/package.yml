notes: "Frozen copy of Factory's dropped ffmpeg-6 (PMBS A_tw-ffmpeg-6). Tarball is a git archive of the n6.1.x tag with excludes (watch), so ffmpeg.org's release tarball differs. Spec carries a local svtav1 bcond (off): Factory SVT-AV1 is 4.x, this ffmpeg needs < 4, and a private SVT-AV1 3.0.1 would shadow Factory's for every ffmpeg build."
